<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="icon-title">
  <title id="icon-title">Masterclass 101</title>
  <!--
    App icon, Direction A (Hi-Vis). No text.
    An image file cannot read CSS variables, so its colors mirror
    src/design/tokens.css by hand: #151311 is the base token, #d7ff3d the
    accent token, #f2ede4 the text token (the faint work light, top left).
    If a token changes, change it here too.
    Never write two hyphens in a row inside this comment: XML forbids it and
    the whole icon stops loading.
    Maskable safe: the background bleeds to every edge, and the square's
    corners sit 181 px from the center, inside the 205 px safe circle
    (80% of the width), so no platform mask can clip the mark.
    app-engineer renders the PNGs (180, 192, 512) from this file with sharp.
  -->
  <defs>
    <radialGradient id="worklight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(620 420)">
      <stop offset="0" stop-color="#f2ede4" stop-opacity="0.07" />
      <stop offset="1" stop-color="#f2ede4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#151311" />
  <rect width="512" height="512" fill="url(#worklight)" />
  <!-- The square: a 2 x 2 ft polish section, taped off. -->
  <rect x="128" y="128" width="256" height="256" rx="14" fill="#d7ff3d" />
  <rect x="161" y="161" width="190" height="190" rx="4" fill="none" stroke="#151311" stroke-width="12" />
</svg>
