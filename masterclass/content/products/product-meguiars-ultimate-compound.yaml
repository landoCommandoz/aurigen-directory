jobs:
  - Compound, only when the test spot proves it is needed
  - Rung 3 of the pad ladder, on maroon, 3 to 4 sets, panel at 100 µm or more
  - Wipe it with its own towel, then always follow with yellow + M210 to clear the haze
neverFor:
  - Any panel reading under 100 µm
  - Vinyl wrap, paint protection film, or matte and satin paint
  - A pad used for polish. One pad per liquid.
  - More than one compound pass per section
labelNotes: "On a Tesla, the house ladder and Tesla's manual disagree. House: compound is rung 3, only when the test spot proves it is needed. Tesla's manual says do not use cutting pastes, color restoration compounds, or polishes with harsh abrasives, because they can permanently damage the paint, and cleaning-product damage is not covered by the warranty. Lando decides how this applies to Teslas (pending)."
