sources:
  - label: Verification log FC-78
    date: 2026-10-11
    note: Blue Magic's own site no longer loads. A retail listing names item 725, 8 oz, wipe on and wipe off. No maker source gives a time per light or how long the result lasts. The two minutes and the month are house numbers.
jobs:
  - Headlight refresh by hand, about two minutes per light, then wipe clean
  - Sell it as a refresh. Without a sealant on top, the lights yellow again in about a month.
neverFor:
  - Selling it as a fix. It brightens but does not hold.
labelNotes: "The two minutes per light and the month before they yellow again are house numbers. No label or maker source confirms them yet. Read the directions on your bottle; the bottle wins."
