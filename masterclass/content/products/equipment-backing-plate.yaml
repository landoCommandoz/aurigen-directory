specs:
  - label: Size
    value: 6 in. (150 mm), hook and loop
    status: sourced
  - label: Mount
    value: Bolts on through a center hole with the Spindle Bolt. Use a hex wrench. The spindle lock is under the auxiliary handle; remove two screws and slide the handle off to reach it. Do not overtighten.
    status: sourced
  - label: Thread
    value: M8 x 1.25
    status: sourced
  - label: Do not buy
    value: HF item 64913, the $6.99 BAUER 6 in. backing pad on the shelf. It is 5/16 in.-24 thread. That is an inch thread and the 56367 is metric, so it does not fit.
    status: sourced
  - label: Replace with
    value: A 6 in. (150 mm) plate made for a long-throw, mounted with an M8 bolt.
    status: sourced
  - label: Never downsize
    value: Long-throw machines are counterweighted for 5 or 6 in. plates. A 3 in. plate causes violent vibration and can wear out the bearings.
    status: sourced
  - label: First call
    value: HF tech and parts line, 1-888-866-5797, printed in the manual. Give them UPC 193175448170 and ask for the replacement backing pad for item 56367.
    status: sourced
  - label: Will HF have one
    value: Not confirmed. The manual warns some parts are not sold separately.
    status: verify
  - label: Backup plate
    value: ShineMate Heavy Duty 6 in. The seller says M8 thread, M8 bolt included, and that it fits most 5 to 6 in. long-throws.
    status: verify
  - label: Backup plate fit
    value: Not confirmed. The seller describes a female M8 thread plus an M8 bolt. The 56367 plate mounts with a Spindle Bolt through a center hole. Compare the hub to the stock plate before you bolt it on.
    status: verify
  - label: Backup plate price
    value: $23.05 at Parks Car Care for the 6 in., the same as the 5 in. Out of stock on 2026-10-11.
    status: sourced
  - label: Not a backup, the forum Maxshine swap
    value: The forum owner's Maxshine was a 5 in. (125 mm) plate. That is a downsize, which this entry says never to do. He never said how it ran.
    status: sourced
  - label: Not a backup, Maxshine 6 in.
    value: A retailer lists Maxshine's standard 6 in. DA plate with 5/16 in. threads, not M8.
    status: verify
  - label: Not a backup, Griot's BOSS G21
    value: One owner said it looks very similar. Nobody reported fitting one.
    status: verify
  - label: Do not buy, Buff and Shine 600Y
    value: Buff and Shine's own 6 in. plate has 5/16 in.-24 threads. The 56367 uses M8.
    status: sourced
  - label: Pads on this plate (pending)
    value: Buff and Shine's 6 in. Uro-Tec has a 7 in. face, and the manual says the largest accessory is 6 in. Which Uro-Tec size goes on the 56367 is for Lando to decide.
    status: verify
  - label: Spare
    value: A spare 6 in. M8 plate is on the purchase roadmap.
    status: house
    kbRef: "3.5"
checks:
  - text: Unplugged, check the center bolt is tight.
    status: sourced
  - text: Check the pad is centered.
    status: sourced
  - text: Check the hooks are not bald or melted.
    status: sourced
  - text: Check the plate is not cracked or warped. Spin it by hand and watch the edge.
    status: sourced
  - text: Compare the new plate's hub to the old one before you bolt it on.
    status: sourced
