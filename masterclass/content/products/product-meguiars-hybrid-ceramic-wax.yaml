labelNotes: "Standard method: on a wet car, spray, rinse, dry. No haze, no buffing, no waiting. Wax as you dry: wet panel, light mist, dry with a clean towel, skip the second rinse. No cure time. Meguiar's recommends two coats: apply on the wet car, dry, re-wet, and repeat. House plan: a whole-car coat the next day counts as the second coat on a freshly polished panel. If your bottle says something different, the bottle wins."
