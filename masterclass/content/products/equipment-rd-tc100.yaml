checks:
  - text: Zero ONLY on the included bare plate. Never press ZERO on the car. It offsets every later reading.
    status: sourced
  - text: Hold it flat.
    status: sourced
  - text: Door jamb first. That is your baseline.
    status: sourced
  - text: Take 3 to 5 readings per panel, the middle, then toward each corner. Write them down.
    status: sourced
  - text: 20 µm swings within a foot are normal.
    status: sourced
  - text: On a Tesla, owners report about 4 to 6 mils (100 to 150 µm), highest on the hood. That comes from an owner forum, not from Tesla.
    status: verify
  - text: Lando's hood read above 100 everywhere.
    status: house
