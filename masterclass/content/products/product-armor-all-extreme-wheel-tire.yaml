sources:
  - label: Knowledge base 5.1, house wheel step
    date: 2026-10-07
    note: Wheels first, one wheel at a time, brush, rinse before it dries. The wait time follows the label, 30 seconds (fact-checker FC-26).
  - label: Armor All product page, Extreme Wheel & Tire Cleaner
    url: https://armorall.com/product/extreme-wheel-tire-cleaner
    date: 2026-10-11
    note: One wheel at a time. Eye protection and rubber gloves. Wet and cool the wheel, saturate it from 6 inches, let the foam work 30 seconds, wipe with a soft cloth or sponge, rinse, dry. Test a hidden spot; stop if it hazes or spots. Not on warm or damaged wheels, damaged clear coat, or brake parts. Check with the maker before motorcycles or uncoated polished aluminum. Keep wash water out of storm drains, streams, and lakes. Fact-checker FC-26, FC-27, FC-91.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: Tesla Model Y owner's manual, wheel cleaner caution
    url: https://www.tesla.com/ownersmanual/modely/en_ae/GUID-65384C1F-86F2-44E8-A8BC-8A12E7E00A40.html
    date: 2026-10-10
    note: No chemical-based wheel cleaners or pre-wash products. Same wording in the Model 3, S, X, and Cybertruck manuals. Read through the search index. Fact-checker FC-16.
    confirmedOn: 2026-10-10
    confirmedBy: fact-checker
  - label: Tesla Model Y owner's manual, warranty line
    url: https://www.tesla.com/ownersmanual/modely/en_us/GUID-65384C1F-86F2-44E8-A8BC-8A12E7E00A40.html
    date: 2026-10-10
    note: Damage or discoloration from cleaning products is not covered by the warranty. Read through the search index. Fact-checker FC-16.
    confirmedOn: 2026-10-10
    confirmedBy: fact-checker
  - label: Tesla Model Y 2020 to 2024 owner's manual, China edition, software 2026.26
    url: https://www.tesla.cn/ownersmanual/2020_2024_modely/en_cn/Owners_Manual.pdf
    date: 2026-10-11
    note: Pages 178 to 181 carry the same wheel cleaner, pre-wash, and warranty cautions, so they apply to a 2022 Model Y. Read directly. Fact-checker FC-38.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
jobs:
  - Wheels and tires, first in the wash
  - No bucket. This, a brush, and the hose.
  - Put on eye protection and rubber gloves first.
  - Wet and cool the wheel with the hose. Spray the face and barrel. Let it work 30 seconds. Brush, then rinse well before it dries. One wheel at a time.
neverFor:
  - A wheel that is warm to the touch
  - A damaged wheel, or a wheel with damaged clear coat
  - Brake parts
  - Motorcycle wheels or uncoated polished aluminum, until the maker says yes
notes:
  - text: The label says wipe with a soft cloth or sponge. Brushes are a house choice.
    status: sourced
  - text: On a bike, what to use on the wheels is for Lando to decide (pending).
    status: verify
  - text: On a Tesla, the house step is the same wheel step as every car.
    status: house
  - text: On a Tesla, Tesla's manual disagrees with the house step. It says do not use chemical-based wheel cleaners or pre-wash products, because they can damage the finish on the wheels. It also says damage or discoloration from cleaning products is not covered by the warranty.
    status: sourced
  - text: Lando decides how this applies to Teslas (pending).
    status: verify
labelNotes: "Armor All label: wear eye protection and rubber gloves. Wet and cool the wheel with a hose. Hold the bottle 6 inches away and soak the wheel. Let the foam work 30 seconds. Wipe with a soft cloth or sponge, rinse well, and dry. Test a hidden spot first. If it hazes or spots, stop. Never on a warm or damaged wheel, or a wheel with damaged clear coat. Keep it off brake parts. Before using it on motorcycles or uncoated polished aluminum, check with the maker. Do not let the wash water reach storm drains, streams, or lakes."
