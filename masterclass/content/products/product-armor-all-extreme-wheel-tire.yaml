labelNotes: "On a Tesla, the house step and Tesla's manual disagree. House: the same wheel step as every car. Tesla's manual says do not use chemical-based wheel cleaners or pre-wash products, because they can damage the finish on the wheels. Tesla's manual also says damage or discoloration from cleaning products is not covered by the warranty. Lando decides which applies (pending)."
