sources:
  - label: Knowledge base 9.2, house tire shine method
    date: 2026-10-07
    note: Spray onto the applicator, not the tire. Thin coat. Wipe the rubber-to-wheel edge.
  - label: Armor All product page, Extreme Tire Shine trigger spray
    url: https://armorall.com/product/extreme-tire-shine-spray
    date: 2026-10-11
    note: Spray evenly onto a clean, dry tire from 4 to 6 inches. Do not wipe. Keep it off clear plastic, glass, fabric, and paint. Dry at least 3 to 5 minutes. Not for cycle tires, cycle seats, pedals, grips, steering wheels, floors, or brake drums. Fact-checker FC-28, FC-29, FC-30.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: Armor All product page, Extreme Tire Shine aerosol
    url: https://armorall.com/product/extreme-tire-shine-aerosol
    date: 2026-10-11
    note: Spray evenly on a clean, dry tire from 8 to 12 inches. Do not wipe. Dry at least 5 minutes. Same not-for list. Fact-checker FC-28, FC-29, FC-30.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
jobs:
  - Tires, after the paint is done
  - "House method: spray it onto the applicator, not the tire. Tire completely dry. Thin, even coat. Wipe the rubber-to-wheel edge."
  - Let it dry at least 3 to 5 minutes before the car moves. That is the trigger spray label. The aerosol label says at least 5 minutes.
neverFor:
  - Any motorcycle. Ever.
  - Cycle tires, cycle seats, pedals, grips, steering wheels, floors, or brake drums
  - Paint, glass, clear plastic, or fabric
  - The car before the paint is polished
  - Grey faded trim. That needs a trim restorer.
labelNotes: "The house method and the label differ. House: spray onto the applicator, not the tire, so no overspray lands on paint. Armor All label: spray evenly onto a clean, dry tire from 4 to 6 inches (trigger) or 8 to 12 inches (aerosol), and do not wipe. The label also says keep it off paint, glass, clear plastic, and fabric. Lando decides which method the crew uses (pending). Dry time: at least 3 to 5 minutes on the trigger label, at least 5 minutes on the aerosol label. Which one Lando owns is not recorded, so read your bottle. The label says not for cycle tires, cycle seats, pedals, grips, or steering wheels. The house rule is stricter: no tire shine on a motorcycle at all."
