jobs:
  - Front end, mirrors, and rocker tar, before washing
  - Foam on. Let it soften the bugs and tar. Then hose it off or wash over it. No scrubbing.
  - Rocker tar before clay. If clay will not lift tar, use this, not more clay.
neverFor:
  - A hot motorcycle exhaust. It bakes on.
labelNotes: "Meguiar's says spray it on, let it soften the bugs and tar, then hose it off or wash over it. No scrubbing. The house dwell is about one minute, but no label confirms that number. Read the dwell time on your can. The can wins."
