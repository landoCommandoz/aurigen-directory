    value: "1-888-866-5797"
    status: sourced
  - label: Power on mobile jobs
    value: Draws about 7.5 A. Any normal household outlet. 12-gauge cord, 50 ft max.
    status: verify
    kbRef: "18.2"
  - label: Generator
    value: 2,000 W inverter minimum. Never run the vacuum and the polisher together.
