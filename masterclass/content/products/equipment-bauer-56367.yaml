sources:
  - label: HF product page, item 56367
    date: 2026-10-07
    note: Specs and speed guidance. The FAQ line on centering the pad and spreading compound was not found again on 2026-10-11 (verification log FC-62).
  - label: HF product page, item 56367, spec table
    url: https://www.harborfreight.com/75-amp-6-in-20-mm-long-throw-random-orbit-da-polisher-56367.html
    date: 2026-10-10
    note: "Thread Size M8-1.25. Model 1918E-B. The thread size comes from this page, not the manual. Read through the search index. Fact-checker FC-17 and FC-18."
    confirmedOn: 2026-10-10
    confirmedBy: fact-checker
  - label: HF item page, 56367
    url: https://go.harborfreight.com/sku/56367/
    date: 2026-10-10
    note: Speeds 2 to 3 to apply or remove wax or sealant, speeds 4 to 6 when compounding or polishing. Fact-checker FC-22.
    confirmedOn: 2026-10-10
    confirmedBy: fact-checker
  - label: HF item page, 56367, rechecked
    url: https://go.harborfreight.com/sku/56367/
    date: 2026-10-11
    note: Six-speed dial with electronic speed control, constant speed and power under load. The 20 mm orbit gives 3 times the corrective action per orbit of a short-throw DA. Fact-checker FC-61.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: BAUER 56367 owner's manual, 2021
    url: https://manuals.harborfreight.com/manuals/56000-56999/56367-193175448170.pdf
    date: 2026-10-10
    note: Page 3 and page 10 on abnormal vibration. Page 7, the 30-second test run. Page 8, slower speeds and pressure off the tool. Page 10, checks before each use. Every page footer prints the tech line. No thread size anywhere in the manual. Fact-checker FC-18, FC-20, FC-22, FC-23, and FC-24.
    confirmedOn: 2026-10-10
    confirmedBy: fact-checker
  - label: BAUER 56367 owner's manual, 2021, rechecked
    url: https://manuals.harborfreight.com/manuals/56000-56999/56367-193175448170.pdf
    date: 2026-10-11
    note: 120 VAC, 60 Hz, 7.5 A on a 15 A circuit. No load speed 2,000 to 4,600 per minute. Max accessory diameter 6 in. (150 mm). Keep a firm grip with both hands to resist starting torque. GFCI supply in damp places, a W-A cord outdoors, plug connections off the ground, and add the amps when one cord runs more than one tool. Cord table for 7.1 to 12.0 A, 14 gauge at 50 ft and 12 gauge at 75 ft. If the foam pad keeps coming off, too much wax may be on it. No generator guidance. Fact-checker FC-54, FC-55, FC-56, FC-61, FC-62, FC-64.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: Verification log FC-107
    date: 2026-10-11
    note: The Utah Labor Commission says minors may not work in hazardous occupations, including operating power equipment. DJ's age is not recorded. Who may run power tools is Lando's decision (pending).
specs:
  - label: Harbor Freight item
    value: "56367"
    status: sourced
  - label: Model
    value: 1918E-B
    status: sourced
  - label: Type
    value: Free-spinning dual action (DA). Not a rotary.
    status: sourced
  - label: Throw
    value: 20 mm long-throw, random orbit
    status: sourced
  - label: Motor
    value: 7.5 Amp
    status: sourced
  - label: Backing plate size
    value: 6 in. The manual says the largest accessory is 6 in. (150 mm).
    status: sourced
  - label: Pad size (pending)
    value: Buff and Shine's 6 in. Uro-Tec has a 7 in. face. Which Uro-Tec size goes on this polisher is for Lando to decide. See the pad entries.
    status: verify
  - label: Speed dial
    value: Six speeds, about 2,000 to 4,600 per minute at no load
    status: sourced
  - label: Electronics
    value: Constant-speed, soft start
    status: sourced
  - label: HF, wax or sealant
    value: Speeds 2 to 3 to apply or remove wax or sealant
    status: sourced
  - label: HF, polishing
    value: Speeds 4 to 6 for polishing or compounding
    status: sourced
  - label: House settings
    value: Spread on 1 to 2. Work on 4.
    status: house
    kbRef: "8.3"
  - label: Speed, the 56367 manual
    value: The 56367 manual says only use slower speeds for polishing, or the paint may be damaged. It does not say which speeds count as slower.
    status: sourced
  - label: House pressure
    value: About 10 lb. Last set, let the machine float on its own weight.
    status: house
    kbRef: "8.3"
  - label: Pressure, the 56367 manual
    value: The 56367 manual says keep pressure off the tool. The foam pad should lightly touch the paint.
    status: sourced
  - label: Lando decides which applies (pending)
    value: Speed 4 and about 10 lb, or the manual's slower speeds and light touch. Until he decides, the house settings stay.
    status: verify
  - label: House grip
    value: Two hands, loose grip. Guide it, don't push.
    status: house
    kbRef: "21"
  - label: Grip, the 56367 manual
    value: The 56367 manual says keep a firm grip with both hands to resist starting torque, and keep pressure off the tool.
    status: sourced
  - label: Lando decides the grip wording (pending)
    value: Loose grip, or the manual's firm grip with both hands.
    status: verify
  - label: Backing plate thread
    value: M8 x 1.25, from the HF product page
    status: sourced
    kbRef: "14"
  - label: Tech and parts line, printed in the manual
    value: "1-888-866-5797"
    status: sourced
  - label: Power on mobile jobs
    value: Draws 7.5 A on a 120 V, 15 A circuit. Any normal household outlet.
    status: sourced
    kbRef: "18.2"
  - label: Cord
    value: 12-gauge, 50 ft max. That is stricter than the manual, which allows 14-gauge at 50 ft and 12-gauge up to 75 ft.
    status: sourced
    kbRef: "18.2"
  - label: Outdoors and wet ground
    value: Outdoors, use a cord marked W-A. Near water, plug into a GFCI outlet. Keep plug connections off the wet ground. One cord, one tool.
    status: sourced
  - label: Generator
    value: 2,000 W inverter minimum. Never run the vacuum and the polisher together. No source sets a generator size. The polisher alone runs at about 900 W (7.5 A at 120 V).
    status: verify
    kbRef: "18.2"
  - label: Who may run it (pending)
    value: Who may run power tools is for Lando to decide.
    status: verify
    kbRef: "19"
checks:
  - text: "Test run before you polish: pad mounted on the backing pad, plug in, set the highest speed, and run it at least 30 seconds off the car."
    status: sourced
  - text: Abnormal noise or vibration? Stop use immediately. Get it fixed before further use. The manual says so.
    status: sourced
  - text: Before each use, look for loose hardware, misaligned or binding parts, and cracked or broken parts. Do not use damaged equipment.
    status: sourced
  - text: To reduce vibration, center the foam pad on the backing pad and spread compound evenly around the pad. This HF FAQ line was not found again on recheck.
    status: verify
  - text: Foam pad keeps coming off the backing pad? The manual says too much wax may be on it.
    status: sourced
  - text: Unplugged, check the center bolt is tight, the pad is centered, the hooks are not bald or melted, and the plate is not cracked or warped. Spin it by hand and watch the edge.
    status: sourced
  - text: Cord over your shoulder. Rest the polisher on its side on a towel.
    status: house
  - text: Never park it spinning in one spot.
    status: house
