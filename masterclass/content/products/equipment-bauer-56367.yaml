checks:
  - text: Abnormal vibration? Stop use immediately. The manual says so.
    status: sourced
  - text: To reduce vibration, center the foam pad on the backing pad and spread compound evenly around the pad.
    status: sourced
  - text: Unplugged, check the center bolt is tight, the pad is centered, the hooks are not bald or melted, and the plate is not cracked or warped. Spin it by hand and watch the edge.
    status: sourced
  - text: Cord over your shoulder. Rest the polisher on its side on a towel.
    status: house
