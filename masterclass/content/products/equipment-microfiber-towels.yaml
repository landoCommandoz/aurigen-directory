sources:
  - label: Knowledge base 13.3
    date: 2026-10-07
    note: Hot water for the product piles; Meguiar's washes its own polishing cloths hot
  - label: The Rag Company use and care tips
    url: https://www.theragcompany.com/use-and-care-tips
    date: 2026-10-11
    note: Warm or cold water; avoid hot water and sanitize cycles. No fabric softener, no bleach. Tumble dry on low or air dry. Keep microfiber away from cotton and anything that sheds lint. A towel maker's own care guide, not Lando's towel brand. Fact-checker FC-88 and FC-89.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
specs:
  - label: Wash method
    value: 16 or more, one per panel, folded in quarters.
    status: house
  - label: Per full detail
    value: 24 to 30, plus 16 wash towels with the towel method.
    status: house
    kbRef: "18.4"
checks:
  - Lift each towel out dripping. Straight lines, front to back. Never circles.
  - A used towel never goes back in the bucket.
  - Lower panels never share a towel. Rockers and mirrors go last, then retire that towel.
  - text: "Three piles that never mix: water-only, product, and wheels."
    status: house
  - text: Product towels soak 1 hour in warm soapy water first. Wax-residue towels get at least two washes.
    status: house
  - text: House rule. Hot water for the product piles. Warm is fine for the water-only pile.
    status: house
  - text: The Rag Company, a towel maker, says warm or cold water, never hot.
    status: sourced
  - text: Follow the care tag on your towels. Lando decides hot or warm (pending).
    status: verify
  - Dye-free, fragrance-free detergent. Full cycle, extra rinse.
  - text: Never fabric softener or bleach.
    status: sourced
  - Never dryer sheets.
  - text: Microfiber only. Never with cotton or terry.
    status: sourced
  - text: Dry on low or air dry.
    status: sourced
  - text: Dryer heat is what melts microfiber.
    status: house
