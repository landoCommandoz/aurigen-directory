  - label: Verification log FC-31
    date: 2026-10-11
    note: No Hot Shine label was read from Meguiar's. Retail copies say it is not for two-wheeled vehicles and is sprayed onto the tire. Which Hot Shine Lando owns is not recorded.
jobs:
  - Tire shine backup, same rule as the Armor All. Spray it onto the applicator.
neverFor:
  - Any motorcycle. Ever.
  - The car before the paint is polished
  - Anywhere near the heat gun, a hot surface, or sparks, if yours is an aerosol
notes:
  - text: "House rule: spray the applicator, never on a motorcycle."
    status: house
  - text: Meguiar's directions for Hot Shine and its two-wheeler line were not read. Read your bottle.
    status: verify
  - text: The safety data sheet lines are for the aerosol cans. The trigger bottle was not checked.
    status: verify
labelNotes: "If your Hot Shine is an aerosol can, it is a flammable aerosol. Keep it away from the heat gun, hot surfaces, and sparks. Use it outdoors or where the air moves (Meguiar's safety data sheet). Keep it out of your eyes."
