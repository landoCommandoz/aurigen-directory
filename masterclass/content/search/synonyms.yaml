# ---------------------------------------------------------------------------
# Lando's own words (pending)
#
# Lando was asked for the words he and DJ actually say when something goes
# wrong. His answer has not arrived. Until it does, every group below comes
# from knowledge base 21 (the FIX-01 "Say it" list and each seed's title),
# the knowledge base 24 search test set, and the way a frustrated person
# dictates with gloves on (no apostrophes, slang, "all over", dictation
# misses). When his words arrive, add them here as new groups or append
# them to the group that means the same thing, then run npm run content.
#
# Slots for his words (fill in, then uncomment):
# - words: [<Lando's word for the polisher jerking>, jerking, hopping]
#   note: Lando, his own words
# - words: [<DJ's word for the pad stopping>, stalls, quit spinning]
#   note: DJ, his own words
# ---------------------------------------------------------------------------
#
# How a group works (src/core/searchEngine.ts): when an item holds any word or
# phrase of a group, every word of the group is added to that item's search
# words. So a query word finds every item that holds any word of its group.
# Keep groups narrow. A common word ("pad", "polish", "wash", "paint", "roof",
# "lube", "charge") in a group spreads the whole group across dozens of items
# and buries the right answer. Use a phrase instead ("clay lube", not "lube").
# Owner: troubleshooter.
version: 1
groups:
  # ---------- Machine ----------
  - words: [jerking, jerks, jerky, hopping, hops, hoping, bouncing, bouncy, bucking, kicking, fighting me]
    note: Knowledge base 21 FIX-01 say-it list, plus dictated variants. "hoping" is a dictation miss for "hopping"
  - words: [polisher, buffer, buffing machine, orbital polisher]
    note: What people call the BAUER 56367 (knowledge base 3.1)
  - words: [vibrating, vibration, vibrates, shaking, shakes, shaky, wobble, wobbling, wobbly, numb hands, hands going numb]
    note: Knowledge base 21 FIX-03 and FIX-01 stop line
  - words: [stalls, stalling, stalled, bogging, bogs down, quit spinning, stopped spinning, not spinning, not rotating, stops turning]
    note: Knowledge base 21 FIX-02 and 8.3 marker line
  - words: [slinging, sling, slung, splatter, spatter, splattering, flinging, flung]
    note: Knowledge base 21 FIX-06 and FIX-20
  - words: [velcro, hook and loop]
    note: Knowledge base 14 and FIX-07
  - words: [dusting, dusty, powder, powdery, powdering]
    note: Knowledge base 21 FIX-08
  - words: [grinding, squealing, clicking, rattling, whining, screeching]
    note: Knowledge base 21 FIX-01 and FIX-03 stop line, the polisher sounds wrong
  - words: [burning smell, smells hot, smells like burning, motor smell, stinks, smoking, smoke coming out]
    note: Knowledge base 21 FIX-01 stop line
  - words: [backing plate, backing pad, pad holder]
    note: Knowledge base 14. HF calls it a backing pad
  - words: [too hot, super hot, really hot, overheating, scorching]
    note: Knowledge base 21 FIX-12 and 8.3
  - words: [marker line, sharpie line, marker mark]
    note: Knowledge base 8.3 rotation check

