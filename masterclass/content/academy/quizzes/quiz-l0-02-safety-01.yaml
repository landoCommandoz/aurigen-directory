    confirmedBy: fact-checker
prompt: A car that is not a Tesla just pulled in from a highway drive. The wheels are hot to the touch. You have the wheel cleaner in hand. What do you do?
choices:
  - Spray now and rinse it off fast.
  - Gloves on and spray now. Rinse fast.
  - Wait till cool. Gloves and eye protection on.
  - Spray extra so the cleaner stays wet.
correctIndex: 2
explanation: The wheel cleaner label says never use it on a wheel that is warm to the touch, and wear eye protection and rubber gloves. Let the wheels cool, gear up, then spray, and rinse before it dries.
