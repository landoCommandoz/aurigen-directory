prompt: A rider pulls in and wants a wash right away. The pipes are still hot. What do you do?
choices:
  - Wash it, but keep water off the pipes.
  - Cool the pipes down with the hose first.
  - Wait until the bike is stone cold.
  - Spray bug remover on the exhaust while it is warm.
correctIndex: 2
explanation: The bike must be stone cold. Water on hot pipes stains chrome, and bug remover on a hot exhaust bakes on.
scenario: true
