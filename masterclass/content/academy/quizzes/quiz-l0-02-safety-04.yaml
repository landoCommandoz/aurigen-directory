prompt: The Hot Shine aerosol can is sitting on the cart next to the heat gun, and the garage door is shut. What do you do?
choices:
  - Leave it. The can is sealed shut.
  - Move it from the heat. Open the door.
  - Warm it with the heat gun so it sprays.
  - Set it on the hot hood to save room.
