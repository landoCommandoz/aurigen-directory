explanation: Pushing it into the paint is one cause of a jerking polisher. Keep two hands on it and the pad flat, and guide it. How tight to hold it is not settled yet. The house says a loose grip, and the 56367 manual says a firm grip with both hands to resist starting torque. Lando decides the grip wording (pending).
