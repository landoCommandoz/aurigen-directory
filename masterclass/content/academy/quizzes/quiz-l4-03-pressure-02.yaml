prompt: The polisher keeps jerking and walking. You are gripping tight and pushing it into the paint. What changes?
choices:
  - Loose grip. Guide it, do not push.
  - Push harder to hold it still.
  - Tilt the pad onto its edge.
  - Hold it tight with one hand.
