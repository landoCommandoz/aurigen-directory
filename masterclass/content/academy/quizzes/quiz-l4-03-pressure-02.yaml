prompt: The polisher keeps jerking and walking. You are pushing it hard into the paint. What changes?
choices:
  - Two hands, pad flat, stop pushing.
  - Push harder to hold it still.
  - Tilt the pad onto its edge.
  - Hold it with one hand.
