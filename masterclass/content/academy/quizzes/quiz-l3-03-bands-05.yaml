prompt: The other panels have a median of 150 µm. The left fender reads 104 at its lowest. What is it?
choices:
  - A normal panel. It is over 100.
  - A thin panel. Go light or skip.
  - A repaint. Go gentle or skip.
  - Clear coat failure. Do not polish.
correctIndex: 1
explanation: A panel more than 40 µm below the median of the other panels is thin. 150 minus 104 is 46.
scenario: true
