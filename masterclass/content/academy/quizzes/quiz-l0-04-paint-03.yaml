prompt: Lando is polishing a 1972 pickup with its original single-stage paint, and red shows on the pad. What happens?
choices:
  - Stop for good. The pad is through the clear coat.
  - Press harder to get past the color layer.
  - Switch to compound to cut through it faster.
  - The one exception. Say it, note it, back off pressure.
correctIndex: 3
explanation: On old single-stage paint, the color is the top layer, so some color on the pad is normal. On any modern car, color on the pad means stop.
scenario: true
