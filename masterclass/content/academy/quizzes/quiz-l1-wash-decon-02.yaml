prompt: The wipers ran and Sentry fired during a Tesla wash. What would Car Wash Mode have done?
choices:
  - Locked the doors and left the rest alone.
  - Turned on the heater and the defrost.
  - Closed the windows; stopped wipers and Sentry.
  - Rolled the windows down so they dry.
correctIndex: 2
explanation: It closes all windows, locks the charge port, and turns off the wipers, Sentry Mode, walk-away door locking, and parking chimes. It turns off above 9 mph or when you touch Exit.
