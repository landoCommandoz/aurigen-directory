prompt: DJ washed a Uro-Tec pad in hot water, wrung it out, and set it face up to dry. What does the house way change?
choices:
  - Nothing. That is the right way.
  - Add bleach to the hot water.
  - Warm water, press, dry face down.
  - Dry it in the dryer on high.
correctIndex: 2
explanation: "Warm water, not hot: hot is hard on foam. Press the water out, never wring. Dry face down on a rack."
