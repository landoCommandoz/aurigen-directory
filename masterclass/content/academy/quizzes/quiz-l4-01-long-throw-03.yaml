  - label: Backing plate research (knowledge base 14)
    date: 2026-10-07
    note: Unplugged checks of the bolt, pad, hooks, and plate. Long-throw machines are counterweighted for 5 or 6 in. plates.
prompt: The polisher vibrates hard. DJ suggests a 3 in. backing plate to calm it down. Good idea?
choices:
  - Yes. Smaller is smoother.
  - No. A 3 in. plate makes it worse.
  - Yes, but only on bumpers.
  - Tape the pad to the plate instead.
correctIndex: 1
explanation: A long-throw is counterweighted for 5 or 6 in. plates. A 3 in. plate causes violent vibration and can wear out the bearings. Never downsize to stop a vibration.
scenario: true
