sources:
  - label: BAUER 56367 owner's manual, 2021
    url: https://manuals.harborfreight.com/manuals/56000-56999/56367-193175448170.pdf
    date: 2026-10-10
    note: "Page 3 and page 10: if abnormal vibration occurs, stop use; have the problem corrected before further use. Page 7: test run at the highest speed for at least 30 seconds. Page 10: checks before each use. Fact-checker FC-24."
