  - label: Backing plate research (knowledge base 14)
    date: 2026-10-07
    note: Unplugged checks of the bolt, pad, hooks, and plate. Long-throw machines are counterweighted for 5 or 6 in. plates.
prompt: During the test run off the car, the polisher shakes hard and makes a noise it did not make last week. What do you do?
choices:
  - Keep going. New pads shake until they break in.
  - Put a smaller backing plate on to calm it.
  - Turn the speed up so it smooths out.
  - Stop. It gets fixed before anyone uses it.
correctIndex: 3
explanation: The manual says to stop on abnormal vibration and get it fixed before further use. A smaller plate on a long-throw causes violent vibration.
scenario: true
