  - label: R&D TC100 gauge notes (knowledge base 7.2)
    date: 2026-10-06
    note: Zero only on the bare plate; door jamb baseline; 3 to 5 readings per panel; 20 µm swings within a foot are normal; Tesla Model Y owners commonly measure 100 to 150 µm.
prompt: Right on the sharp body line of a door, the gauge reads 78. The flat of the door reads 125. What do you do?
choices:
  - Call the door 75 to 84.
  - No machine on that door.
  - Re-read an inch off the line.
  - Tell the customer it is thin.
correctIndex: 2
explanation: Edges and body lines always read low. Stay an inch off them when you measure.
