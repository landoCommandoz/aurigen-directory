sources:
  - label: R&D TC100 gauge notes (knowledge base 7.2)
    date: 2026-10-06
    note: Zero only on the bare plate (not reconfirmed, no TC100 manual was found, FC-74); door jamb baseline; 3 to 5 readings per panel; 20 µm swings within a foot are normal; Model Y owners report about 100 to 150 µm, an owner report and not a Tesla spec (FC-73).
prompt: The readings look odd and you think the gauge needs zeroing. Where do you zero it?
choices:
  - On the hood, before you start.
  - On the door jamb.
  - On the glass, where there is no paint.
  - Only on its bare plate.
correctIndex: 3
explanation: Zero only on the included bare plate. Never press ZERO on the car; it offsets every reading after it.
scenario: true
