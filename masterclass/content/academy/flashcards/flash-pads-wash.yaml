    note: Warm or cold water only, never hot. Never put pads in the dryer, they will warp. How pads dry after the wash conflicts with the house (face down on a rack vs flat, never face down); Lando decides. Fact-checker FC-70.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
front: When and how do you wash a Uro-Tec pad?
back: The same night. Warm water, never hot, with a drop of laundry detergent, until the water runs clear. Never in the dryer. Heat warps the foam.
