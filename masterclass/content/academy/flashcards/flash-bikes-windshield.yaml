sources:
  - label: National Cycle windshield instruction sheet, 2016
    url: https://www.nationalcycle.com/media/wysiwyg/pdf/ispl/10-118601-000.pdf
    date: 2026-10-11
    note: Do not clean polycarbonate in hot sun or high temperatures. Do not clean the screen with household glass cleaners. Do not allow brake fluid, alcohol, or strong solvents to contact the windshield. Fact-checker FC-82.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: Harley-Davidson service information, windshield care
    url: https://serviceinfo.harley-davidson.com/sip/service/procedure/1952428810735561133/BLAISE/393859/en_US?nid=6372
    date: 2026-10-11
    note: Ammonia-based window cleaners cause permanent yellowing. Powdered, abrasive, or alkaline cleanser can damage the windshield. Read through the search index. Fact-checker FC-82. The no-clay line is house. Which cleaner to use is not chosen (FC-83).
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
front: What is a bike windshield made of, and what never touches it?
back: Plastic. No alcohol, no glass cleaner, no compound, no clay. Never clean it in hot sun.
