  - label: Backing plate research (knowledge base 14)
    date: 2026-10-07
    note: Unplugged checks of the bolt, pad, hooks, and plate. Long-throw machines are counterweighted for 5 or 6 in. plates.
front: Can a smaller backing plate stop a vibration?
back: No. A long-throw is counterweighted for 5 or 6 in. plates. A 3 in. plate causes violent vibration and can wear out the bearings.
