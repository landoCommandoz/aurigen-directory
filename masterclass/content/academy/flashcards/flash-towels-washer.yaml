    note: Hot water for the product piles; Meguiar's washes its own polishing cloths hot. Warm is fine for the water-only pile.
front: What water and detergent for microfiber?
back: Hot for the product piles; warm is fine for the water-only pile. Dye-free, fragrance-free detergent, full cycle, extra rinse.
