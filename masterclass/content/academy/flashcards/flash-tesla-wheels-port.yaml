    date: 2026-10-11
    note: To prevent the wheel cover from falling off, ensure that it is fully secured before driving. Leaving the covers on to clean is house; no Tesla source covers it. Fact-checker FC-42.
front: On a Model Y, what about the wheel aero covers and the charge port door?
back: Leave the aero covers on during the wheel clean. If one ever comes off, Tesla says it must be fully secured before the car moves. The charge port door stays closed.
