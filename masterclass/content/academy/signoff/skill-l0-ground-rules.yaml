ownerChecks:
  - Finds the rule breaks Lando stages on a rule walk, and names each rule.
  - Reads the label on any product new to him before he uses it.
  - Puts a hand on a wheel and on a panel before work, and waits when either is hot.
  - Unplugs the polisher before any check of the bolt, the pad, the hooks, or the plate.
  - Pulls every never-on-paint item off the cart, and keeps every never-in-the-bucket item out of the bucket.
  - Explains clear coat, base coat, single-stage paint, and microns, with no notes.
  - Calls a fingernail catch "it stays," and never promises a scratch comes out.
  - Stages the kit on one cart at the back corner of the car, nothing more than three steps away.
  - Sorts the towels at close-down into three piles that never mix.
