ownerChecks:
  - text: "On a Tesla, turns on Car Wash Mode before any water. The Model Y manual gives the path: Controls > Service > Car Wash Mode."
    status: sourced
  - text: Puts on eye protection and rubber gloves before the wheel cleaner, as its label says.
    status: sourced
  - Does the wheels first, one wheel at a time, on a cool wheel, on a car that is not a Tesla.
  - text: Wets and cools each wheel, lets the cleaner work 30 seconds, and rinses it before it dries, as the label says.
    status: sourced
  - Keeps the wheel brushes off the paint and out of the bucket.
  - text: On a Tesla, the house wheel step is Armor All Extreme Wheel & Tire, a brush, and the hose.
    status: house
  - text: On a Tesla, Tesla's manual says do not use chemical-based wheel cleaners or pre-wash products.
    status: sourced
  - text: Lando decides how this applies to Teslas (pending).
    status: verify
  - Pre-rinses 3 to 4 minutes on jet, top down, before anything touches the paint.
  - text: On a Tesla, Tesla's manual says do not aim a hose directly at windows, door or hood seals, electronic modules, or exposed cabling, and do not wash in direct sunlight.
    status: sourced
  - text: Lando decides how this applies to Teslas (pending).
    status: verify
  - text: Hoses Bug & Tar off or washes over it, and never scrubs, as Meguiar's says.
    status: sourced
  - text: "Bug & Tar wait: about one minute in the house plan, but no label confirms it. Reads the can; the can wins."
    status: verify
  - Never puts a used towel back in the bucket, and never lets lower panels share a towel.
  - Keeps the whole car wet through the wash.
  - Runs the sheeting rinse, blows out the gaps, dries with towels laid flat and pulled, and dries every jamb.
  - text: "Who may run power tools, the compressor included: Lando decides (pending)."
    status: verify
  - Bag tests before he clays, keeps every section wet with lube, and trashes a dropped bar.
  - Leaves no water spots Lando can find under the light.
  - text: Runs no pump-sprayer pre-soak. It is not confirmed (pending).
    status: verify
status: verify
