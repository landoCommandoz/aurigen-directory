  - label: National Cycle windshield instruction sheet, 2016
    url: https://www.nationalcycle.com/media/wysiwyg/pdf/ispl/10-118601-000.pdf
    date: 2026-10-11
    note: Do not clean polycarbonate in hot sun or high temperatures. No household glass cleaners. Keep brake fluid, alcohol, and strong solvents off the windshield. Wash with a soft cloth and warm water and, if needed, a non-abrasive soap such as dishwashing liquid. Fact-checker FC-82 and FC-83.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: Harley-Davidson service information, windshield care
    url: https://serviceinfo.harley-davidson.com/sip/service/procedure/1952428810735561133/BLAISE/393859/en_US?nid=6372
    date: 2026-10-11
    note: Ammonia-based window cleaners yellow windshields for good. Powdered, abrasive, or alkaline cleansers can damage them. Read through the search index. Fact-checker FC-82.
