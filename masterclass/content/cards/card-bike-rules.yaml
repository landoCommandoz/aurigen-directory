rows:
  - label: Tire shine
    value: Never on a motorcycle. Not the sidewall, not near it.
  - label: Nothing slick
    value: Not on brake rotors, grips, pegs, or the seat.
  - label: Temperature
    value: Stone cold before you start. Water on hot pipes stains chrome. Bug remover on a hot exhaust bakes on.
  - label: Water
    value: Hose on low. No pressure at the chain, wheel bearings, electrics, under the seat, or the air intake.
  - label: Drying
    value: Air compressor, every crevice.
  - label: Matte paint, including Harley Denim
    value: No compound, polish, or wax. Matte-safe cleaner only.
  - label: Windshield
    value: It is plastic. No alcohol, no glass cleaner, no compound, no clay.
  - label: Windshield cleaner
    value: The approved plastic cleaner is not confirmed yet.
    status: verify
  - label: Tanks and fenders
    value: Hand-polish them. The 6 in. pad does not fit a tank. A 3 in. machine comes later, from bike revenue.
  - label: Chrome
    value: Chrome polish, then a coat of ceramic wax.
  - label: Chain
    value: Chain-specific cleaner and chain lube only. Household degreaser strips the O-rings.
  - label: Tell every rider
    value: Brakes are wet. The first stop is soft. Ride easy for a block.
  - label: Drop-off only
    value: Motorcycles are drop-off only.
    kbRef: "12.2"
