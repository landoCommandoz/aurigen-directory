    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: Verification log FC-86 and FC-87
    date: 2026-10-11
    note: Matte and Harley Denim care stays house; supporting evidence agrees. Ceramic wax on chrome is not confirmed by Meguiar's.
rows:
  - label: Tire shine
    value: Never on a motorcycle. Not the sidewall, not near it.
  - label: Tire shine, the label
    value: Armor All's tire shine label says not for cycle tires, cycle seats, pedals, grips, or steering wheels.
    status: sourced
  - label: Nothing slick
    value: Not on brake rotors, grips, pegs, or the seat.
  - label: Temperature
    value: Stone cold before you start. Water on hot pipes stains chrome. Bug remover on a hot exhaust bakes on.
  - label: Water
    value: Hose on low. No pressure at the chain, wheel bearings, electrics, under the seat, or the air intake.
  - label: Wheels, the cleaner label
    value: The Armor All wheel cleaner label says check with the maker before you use it on motorcycles or uncoated polished aluminum.
    status: sourced
  - label: Bike wheels (pending)
    value: What to use on bike wheels is for Lando to decide.
    status: verify
  - label: Drying
    value: Air compressor, every crevice.
  - label: Matte paint, including Harley Denim
    value: No compound, polish, or wax. Matte-safe cleaner only.
  - label: Windshield
    value: It is plastic. No alcohol, no glass cleaner, no compound.
    status: sourced
  - label: Windshield, house
    value: No clay.
  - label: Windshield, sun
    value: Do not clean it in hot sun. National Cycle says so.
    status: sourced
  - label: Windshield cleaner (pending)
    value: The approved plastic cleaner is not chosen. National Cycle says warm water and a soft cloth, plus a non-abrasive soap such as dishwashing liquid if needed. Dish soap is on the house never-on-paint list. Lando decides.
    status: verify
  - label: Tanks and fenders
    value: Hand-polish them. The 6 in. pad does not fit a tank. A 3 in. machine comes later, from bike revenue.
  - label: Chrome
    value: Chrome polish, then a coat of ceramic wax. Ceramic wax on chrome is not confirmed by Meguiar's.
    status: verify
  - label: Chain
    value: Use an O-ring safe chain cleaner and an O-ring safe chain lube only. Never gasoline, thinner, steam, a pressure washer, or a wire brush. The wrong solvent can ruin the chain's seals.
    status: sourced
  - label: Chain, house example
    value: Household degreaser strips the O-rings.
  - label: Tell every rider
    value: Brakes are wet. The first stop is soft. Ride easy for a block.
  - label: Drop-off only
    value: Motorcycles are drop-off only.
    kbRef: "12.2"
