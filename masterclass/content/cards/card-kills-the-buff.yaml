sources:
  - label: State Auto risk-control bulletin TB-F41, garage operations and care, custody, and control (2012)
    url: https://sacom-l3.stateauto.com/uploadedfiles/Content/pdfs/TB-F41-1112-NW%20Garage%20Operations%20and%20Care-Custody-Control.pdf
    date: 2026-10-11
    note: Garagekeepers insurance does not protect you if you damage a vehicle through your own work on it. One insurer, 2012. Lando's own policy wording governs. Fact-checker FC-104.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: Verification log FC-86
    date: 2026-10-11
    note: Matte paint and Harley Denim care stays house. Harley's care chart and a licensed vendor agree that gloss polish or wax does not belong on matte. Exact do-not-wax wording was not found.
rows:
  - label: Vinyl wrap
    value: "Sign: seams at the edges, no clear shine inside the jamb. Do: no compound, no polish. Wrap-safe wash and sealant only."
  - label: Paint protection film
    value: "Sign: clear edges on the hood, fenders, and mirrors at an angle. Do: film-safe polish, low speed, no compound, never over an edge."
  - label: Ceramic coating
    value: "Sign: tight beading, slick squeaky paint. Do: polishing removes it. Say so first."
  - label: Matte or satin
    value: "Sign: no reflection, flat finish. Do: no compound, polish, or wax. Matte-safe cleaner only."
  - label: Repaint or thin panel
    value: "Sign: gauge way off the rest. Do: go light or skip. Log it and tell the customer."
  - label: Single-stage paint
    value: "Sign: color transfers to the pad. Do: normal on old paint. Say it, note it, back off pressure."
  - label: Glaze or filler job
    value: "Sign: swirls came back a week after a cheap detail. Do: strip wash first."
  - label: Clear coat failure
    value: "Sign: peeling, flaking, cloudy patches. Do: do not polish."
  - label: Walk away from
    value: Failing clear coat, fresh paint under 30 days, a wrapped car whose owner wants it buffed, and flood, mold, or biohazard cars.
  - label: Also walk away from
    value: Any car worth more than your insurance covers.
    status: verify
  - label: Insurance and your own work
    value: One insurer says garagekeepers coverage does not pay when you damage a car through your own work on it. Polishing through the clear coat may not be covered.
    status: sourced
  - label: Is polishing damage covered (pending)
    value: Not known. Ask the agent in writing whether polishing damage is covered and what would cover it. Lando decides after the answer.
    status: verify
