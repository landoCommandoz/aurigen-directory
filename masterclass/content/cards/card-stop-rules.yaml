title: Rules that never bend
kind: stop
audience: [owner, crew]
visibility: internal
status: house
kbRef: "2"
tags: [rules, stop, safety, house rules]
synonyms:
  - stop rules
  - the rules
  - house rules
  - rules that never bend
  - golden rules
  - when do I stop
  - non negotiable
  - must follow
  - never break
rows:
  - label: 1. Polish at home
    value: All polish jobs happen at home, drop-off, until 25 cars are logged.
  - label: 2. No two-step yet
    value: No two-step correction is sold until 25 cars are logged.
  - label: 3. Founder's rate
    value: The first five machine-polish jobs sell at a $275 founder's rate, stated honestly as a founder's rate.
  - label: 4. Test spot
    value: Test spot on every car before polishing. The paint picks the combo, not a guess.
  - label: 5. Nothing slick first
    value: Nothing slick goes on the car until the paint is polished. No tire shine, no trim dressing, no wax before correction.
  - label: 6. Shade and cool
    value: Shade, cool panels, and no wind for polishing and protection. The panel must be cool enough to hold your hand on.
  - label: 7. Nail catches
    value: If a nail catches, it stays. Show the customer before you start. Never promise it comes out.
  - label: 8. Dropped clay
    value: A dropped clay bar goes in the trash.
  - label: 9. Edges
    value: Stay an inch off edges and body lines. Tape them.
  - label: 10. Color on the pad
    value: STOP. You are through the clear. Old single-stage paint is the only exception.
  - label: 11. Motorcycles
    value: No tire shine on a motorcycle. Ever.
  - label: 12. Label wins
    value: The label on the bottle beats this app.
  - label: 13. Walkaround first
    value: Customer walkaround and before photos happen before anything touches the car.
