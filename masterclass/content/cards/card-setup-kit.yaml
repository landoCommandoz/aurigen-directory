sources:
  - label: Armor All product page, Extreme Wheel & Tire Cleaner
    url: https://armorall.com/product/extreme-wheel-tire-cleaner
    date: 2026-10-11
    note: Wear eye protection and rubber gloves. Fact-checker FC-27.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: Meguiar's safety data sheet, Hot Shine Tire Coating (High Gloss) G13815
    url: https://cdmsweb.3m.com/ingredientcommunication/file/Media/3D-RC8t5LUQ
    date: 2026-10-11
    note: Flammable aerosol. May burst if heated. Keep away from heat, hot surfaces, sparks, and open flames. Use only outdoors or in a well-ventilated area. Fact-checker FC-32.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
  - label: BAUER 56367 owner's manual, 2021
    url: https://manuals.harborfreight.com/manuals/56000-56999/56367-193175448170.pdf
    date: 2026-10-11
    note: GFCI supply in damp places, a W-A cord outdoors, plug connections off the ground, and add the amps when one cord runs more than one tool. Fact-checker FC-56.
    confirmedOn: 2026-10-11
    confirmedBy: fact-checker
rows:
  - label: One cart
    value: Everything lives on one cart or bin set at the back corner of the car.
  - label: Three steps
    value: Never more than three steps for anything.
  - label: Bins by stage
    value: Wheels, Wash, Clay, Polish, Protect, Interior, Glass, Cleanup.
  - label: Wheels bin
    value: Eye protection and rubber gloves. The wheel cleaner label says wear them.
    status: sourced
  - label: Hot Shine can
    value: If yours is an aerosol, it is flammable. Keep it away from the heat gun, hot surfaces, and sparks. Use it outdoors or where the air moves.
    status: sourced
  - label: Night before
    value: Bucket mixed or measured. Towels counted into piles. Pads clean and dry. IPA bottle filled and labeled. Tape in your pocket. Compressor charged. Cords run.
  - label: Cords
    value: Outdoors, use a cord marked W-A. Near water, plug into a GFCI outlet. Keep plug connections off the wet ground. One cord, one tool.
    status: sourced
  - label: Tesla
    value: Car Wash Mode on before any water.
    kbRef: "5.1"
  - label: Setup target
    value: 15 minutes, timed in the app.
    status: verify
  - label: Towels per full detail
    value: Drying 2, polish removal 6 to 8, wax 4, interior 6, glass 4, wheels and jambs 4. Call it 24 to 30.
    kbRef: "18.4"
  - label: Wash towels
    value: Plus 16 with the towel method.
    kbRef: "18.4"
  - label: Color code
    value: Color code towels by zone. The wheel pile never rejoins the paint pile.
    kbRef: "18.4"
  - label: Pads per car
    value: One-step, 2 to 3 finishing or polishing pads.
    kbRef: "18.4"
