rows:
  - label: Car Wash Mode
    value: On before any water.
  - label: Menu path, 2020 to 2024 Model Y
    value: "Controls > Service > Car Wash Mode."
    status: sourced
  - label: What it does
    value: Closes all windows, locks the charge port, and turns off the wipers, Sentry Mode, walk-away door locking, and parking chimes. The car must be parked and not charging. It turns off above 9 mph or when you touch Exit.
    status: sourced
  - label: If you skip it
    value: Tesla's manual says the charge port or wipers can be damaged, and car wash damage is not covered by the warranty.
    status: sourced
  - label: Tape the window trim
    value: Satin black window trim. Polish turns it chalky white.
  - label: Tape the door handles
    value: Flush door handle edges.
  - label: Tape the cameras
    value: All five. Two B-pillar, two fender repeaters, one above the rear plate.
  - label: Tape the badges
    value: Every badge.
  - label: Tape the glass header
    value: The black glass header.
  - label: Tape the cladding
    value: Textured cladding on the wheel arches and the lower bumper.
  - label: Roof
    value: It is glass. Wash it, never polish it. Skip it in the measure and polish routes.
  - label: Charge port door
    value: Stays closed.
  - label: Camera lenses
    value: Glass cleaner only.
  - label: Wheels
    value: Leave the aero covers on during the wheel clean.
  - label: Wheel cleaner, house
    value: Armor All Extreme Wheel & Tire, a brush, and the hose, the same as every car.
    kbRef: "5.1"
  - label: Wheel cleaner, Tesla's manual
    value: Tesla's manual says do not use chemical-based wheel cleaners or pre-wash products. They can damage the finish on the wheels.
    status: sourced
  - label: Compound, house
    value: Rung 3 of the pad ladder allows Ultimate Compound when the test spot proves it is needed.
    kbRef: "8.5"
  - label: Compound, Tesla's manual
    value: Tesla's manual says do not use cutting pastes, color restoration compounds, or polishes with harsh abrasives. They can scour the surface and permanently damage the paint.
    status: sourced
  - label: Warranty, Tesla's manual
    value: Tesla's manual says damage or discoloration from cleaning products is not covered by the warranty.
    status: sourced
  - label: Lando decides which applies (pending)
    value: On a Tesla, the house wheel step, pre-soak, and compound rung, or Tesla's manual.
    status: verify
  - label: Other years and models
    value: Cameras, trim, and the Car Wash Mode menu path differ. Check each car.
    status: verify
