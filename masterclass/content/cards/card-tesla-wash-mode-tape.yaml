rows:
  - label: Car Wash Mode
    value: On before any water.
  - label: Menu path, Model Y
    value: "Controls > Service > Car Wash Mode. Same path on the 2020 to 2024 and the 2025 and newer Model Y."
    status: sourced
  - label: What it does
    value: Closes all windows, locks the charge port, and turns off the wipers, Sentry Mode, walk-away door locking, and parking chimes. The car must be parked and not charging. It turns off above 9 mph or when you touch Exit.
    status: sourced
  - label: If you skip it
    value: Tesla's manual says the charge port or wipers can be damaged, and car wash damage is not covered by the warranty.
    status: sourced
  - label: Tape the window trim
    value: Satin black window trim. Keep polish off it.
  - label: Why the trim gets tape
    value: Tesla's manual says polish can damage chrome and metal finishes. Meguiar's says Ultimate Compound is not for satin finishes.
    status: sourced
  - label: Tape the door handles
    value: Flush door handle edges.
  - label: Tape the cameras, 2020 to 2024 Model Y
    value: All five. Two B-pillar, two fender repeaters, one above the rear plate. The windshield cameras sit behind the glass.
    status: sourced
  - label: Tape the cameras, 2025 and newer Model Y
    value: Six. Also tape the front bumper camera above the grille. It has its own washer nozzle.
    status: sourced
  - label: Tape the badges
    value: Every badge.
  - label: Tape the glass header
    value: The black glass header.
  - label: Tape the cladding
    value: Textured cladding on the wheel arches and the lower bumper.
  - label: Roof
    value: It is glass.
    status: sourced
  - label: Roof, house
    value: Wash it, never polish it. Skip it in the measure and polish routes.
  - label: Charge port door
    value: Stays closed.
  - label: Pre-rinse, house
    value: Pre-rinse on jet 3 to 4 minutes, top down.
    kbRef: "5.1"
  - label: Hose, Tesla's manual
    value: Tesla's manual says do not aim a hose directly at windows, door or hood seals, electronic modules, or exposed cabling, and do not wash in direct sunlight.
    status: sourced
  - label: Lando decides how this applies to Teslas (pending)
    value: The pre-rinse on jet.
    status: verify
  - label: Wash and clay mitts, house
    value: The towel method with 16 microfiber towels, or the two-bucket mitt method. The clay mitt on every car.
    kbRef: "5.2"
  - label: Mitts, Tesla's manual
    value: Tesla's manual says avoid tight-napped or rough cloths, such as washing mitts, and recommends a high-quality microfiber cloth.
    status: sourced
  - label: Lando decides how this applies to Teslas (pending)
    value: The two-bucket mitt method and the clay mitt.
    status: verify
  - label: Camera lenses, house
    value: Glass cleaner only.
    kbRef: "11"
  - label: Camera lenses, Tesla's manual
    value: Spray water on the lens. On a 2020 to 2024 Model Y built before about late May 2023 in Fremont or Austin, do not wipe the lens with a hand or a cloth. On later cars, dry it with a microfiber cloth. Never use chemical-based or abrasive cleaners on a lens.
    status: sourced
  - label: Lando decides how this applies to Teslas (pending)
    value: Camera lenses. A 2022 Model Y built in Fremont or Austin is in the no-wipe group unless its build date says otherwise. Read the build month on the driver door jamb label.
    status: verify
  - label: Wheels
    value: Leave the aero covers on during the wheel clean.
  - label: Wheel covers, Tesla
    value: If a cover ever comes off, Tesla says it must be fully secured before the car moves.
    status: sourced
  - label: Wheel cleaner, house
    value: Armor All Extreme Wheel & Tire, a brush, and the hose, the same as every car.
    kbRef: "5.1"
  - label: Wheel cleaner, Tesla's manual
    value: Tesla's manual says do not use chemical-based wheel cleaners or pre-wash products. They can damage the finish on the wheels.
    status: sourced
  - label: Compound, house
    value: Rung 3 of the pad ladder allows Ultimate Compound when the test spot proves it is needed.
    kbRef: "8.5"
  - label: Compound, Tesla's manual
    value: Tesla's manual says do not use cutting pastes, color restoration compounds, or polishes with harsh abrasives. They can scour the surface and permanently damage the paint.
    status: sourced
  - label: Lando decides how this applies to Teslas (pending)
    value: The house wheel step, the pre-soak, and the compound rung.
    status: verify
  - label: Water-spot remover, Tesla's manual
    value: Tesla's manual says do not use acidic products. Some water-spot removers are strong acids.
    status: sourced
  - label: Lando decides how this applies to Teslas (pending)
    value: Any water-spot remover on a Tesla. No remover is chosen yet.
    status: verify
  - label: Touchscreen, house
    value: Dry microfiber or a screen-safe cleaner only.
    kbRef: "10"
  - label: Touchscreen, Tesla's manual
    value: "Turn on Screen Clean Mode: Controls > Display > Screen Clean Mode. Use a soft lint-free cloth made for displays. No cleaners such as glass cleaner, no hand sanitizer, no wet wipes, and no dry statically-charged cloth such as a recently washed microfiber."
    status: sourced
  - label: Lando decides how this applies to Teslas (pending)
    value: The touchscreen.
    status: verify
  - label: Interior, house
    value: Wipe hard surfaces with Quik Interior Detailer sprayed on the towel.
    kbRef: "10"
  - label: Leather, house
    value: Cleaner, then conditioner. Products not confirmed.
    status: verify
    kbRef: "10"
  - label: Interior, Tesla's manual
    value: No solvents (including alcohol), hand sanitizer, bleach, citrus, naphtha, or silicone-based products on interior parts. Seats get warm water and mild soap on a microfiber, then dry. No conditioners or protectants. Never spray the seat directly. Interior lights get a cloth with warm water only.
    status: sourced
  - label: Lando decides how this applies to Teslas (pending)
    value: The interior wipe and the leather steps.
    status: verify
  - label: Warranty, Tesla's manual
    value: Tesla's manual says damage or discoloration from cleaning products is not covered by the warranty.
    status: sourced
  - label: Other Tesla models
    value: The Car Wash Mode path on the Model S, Model X, and Cybertruck is not checked. Cameras and trim differ by model. Check each car.
    status: verify
