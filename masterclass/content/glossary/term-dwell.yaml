id: term-dwell
type: glossaryterm
title: Dwell time
term: Dwell
definition: The wait while a product sits and works before you rinse it off. Bug & Tar foam gets a one-minute dwell, then you wash it off. Use dwell time for other work, like starting the vacuum during the clay dwell.
