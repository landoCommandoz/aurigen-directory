id: term-hook-and-loop
type: glossaryterm
title: Hook and loop
term: Hook and loop
definition: How the pad holds onto the backing plate. Check the hooks with the polisher unplugged. Bald or melted hooks, worn hooks on the plate or the pad, or heat can make a pad fly off or not stick.
alsoCalled: [hook-and-loop, velcro]
audience: [owner, ops, crew]
visibility: internal
status: sourced
kbRef: "14"
tags: [polisher, pad, backing plate]
synonyms:
  - hooks
  - bald hooks
  - melted hooks
  - pad wont stick
  - velcro on the pad
  - pad keeps coming off
sources:
  - label: Knowledge base 14, backing plate research
    date: 2026-10-07
    note: Unplugged checks before buying a plate, including hooks not bald or melted.
