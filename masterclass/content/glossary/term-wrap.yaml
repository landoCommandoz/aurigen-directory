id: term-wrap
type: glossaryterm
title: Wrap
term: Wrap
definition: A vinyl wrap over the paint. Look for seams at the edges and no clear shine inside the jamb. No compound and no polish. Wrap-safe wash and sealant only. Walk away from a wrapped car whose owner wants it buffed.
