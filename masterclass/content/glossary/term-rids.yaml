id: term-rids
type: glossaryterm
title: RIDS
term: RIDS
definition: Random isolated deep scratches. Fingernail-test each one. If a nail catches, polish will not remove it. Show the customer before you start, and never promise it comes out.
alsoCalled: [random isolated deep scratches, deep scratch]
audience: [owner, ops, crew]
visibility: internal
status: house
