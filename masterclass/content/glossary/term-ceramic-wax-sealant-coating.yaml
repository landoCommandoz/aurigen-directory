id: term-ceramic-wax-sealant-coating
type: glossaryterm
title: Ceramic wax vs sealant vs coating
term: Ceramic wax vs sealant vs coating
definition: Ceramic wax is your spray protection, Meguiar's Hybrid Ceramic Wax. On a wet car you spray, rinse, and dry, with no cure time. A sealant comes as a liquid or a paste. The black pad may later machine-apply one at speed 2 to 3, and a wrapped car gets wrap-safe sealant only. A ceramic coating may already be on a customer's car. You tell it by tight beading and slick, squeaky paint. Polishing removes it, so say so first.
