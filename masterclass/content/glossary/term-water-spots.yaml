title: Water spots
term: Water spots
definition: Spots Utah hard water leaves when it dries on the paint. Prevent them with shade, cool panels, smaller sections, the sheeting rinse, the compressor in the gaps, and drying right away. Never walk away from a wet car in the sun. The ceramic wax works as a drying aid.
