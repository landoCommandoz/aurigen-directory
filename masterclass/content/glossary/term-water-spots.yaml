id: term-water-spots
type: glossaryterm
title: Water spots
term: Water spots
definition: Spots Utah hard water leaves when it dries on the paint. Prevent them with shade, cool panels, smaller sections, the sheeting rinse, the compressor in the gaps, and drying right away. Never walk away from a wet car in the sun. The house also uses the ceramic wax as a drying aid, but Meguiar's does not say it prevents water spots.
