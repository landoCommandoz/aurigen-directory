id: term-m8
type: glossaryterm
title: M8 thread
term: M8
definition: The thread on the BAUER 56367 backing plate, M8 x 1.25, a metric thread. A replacement plate must mount with an M8 bolt. The HF 64913 pad on the shelf is 5/16 in.-24, an inch thread, so it does not fit.
alsoCalled: [M8 x 1.25, M8-1.25]
