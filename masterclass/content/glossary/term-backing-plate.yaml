id: term-backing-plate
type: glossaryterm
title: Backing plate
term: Backing plate
definition: The 6 in. hook-and-loop plate that bolts onto the polisher through a center hole. The pad sticks to it, and you pull the pad off it to wash the pad. On the BAUER 56367 it mounts with an M8 x 1.25 thread. Replace it with a 6 in. plate made for a long-throw. Never downsize it.
