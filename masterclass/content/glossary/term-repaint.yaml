id: term-repaint
type: glossaryterm
title: Repaint
term: Repaint
definition: A panel that has been painted again. On the gauge it reads way above the rest of the car, about 220 µm or more. Go gentle or skip it, log it, and tell the customer. Point out repaints at the walkaround.
