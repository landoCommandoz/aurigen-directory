id: term-bag-test
type: glossaryterm
title: Bag test
term: Bag test
definition: Put your hand in a sandwich bag and glide it over the paint. Gritty means clay it. The bag test decides which panels get clayed. At the walkaround, use the customer's hand.
alsoCalled: [sandwich bag test, baggie test]
audience: [owner, ops, crew]
visibility: internal
status: house
