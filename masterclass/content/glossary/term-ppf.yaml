id: term-ppf
type: glossaryterm
title: PPF (paint protection film)
term: PPF
definition: Paint protection film, a clear film on the paint. Look for its clear edges on the hood, fenders, and mirrors at an angle. Film-safe polish only, low speed, no compound, and never over an edge.
alsoCalled: [paint protection film, film]
