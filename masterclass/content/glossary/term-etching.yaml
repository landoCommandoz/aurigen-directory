id: term-etching
type: glossaryterm
title: Etching
term: Etching
definition: Damage to the clear coat itself from something left on the paint. Fresh water spots wipe off, mineral spots need a water-spot remover, and etched spots need polish. A bike stored dirty can come out in April with etched paint.
alsoCalled: [etched, etched spots]
audience: [owner, ops, crew]
visibility: internal
status: verify
kbRef: "5.4"
tags: [paint, defects, water spots, hard water]
synonyms:
  - etched paint
  - etched spots
  - spots that won't wipe off
  - burned into the paint
  - etched water spots
  - permanent spots
related:
  - term-water-spots
  - sop-dry
  - lesson-l1-04-hard-water-drying
