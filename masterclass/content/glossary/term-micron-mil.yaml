id: term-micron-mil
type: glossaryterm
title: Microns (µm) and mils
term: µm and mil
definition: The units for paint thickness. This app and your gauge use microns (µm). 1 mil = 25.4 µm. Factory paint is usually about 100 to 180 µm in total.
