id: term-long-throw
type: glossaryterm
title: Long-throw
term: Long-throw
definition: A DA with an orbit of 15 mm or more. Yours throws 20 mm, a bigger orbit than a short-throw polisher. Harbor Freight says it does 3 times the corrective work per orbit. Long-throws are counterweighted for 5 or 6 in. plates, so never downsize the plate.
