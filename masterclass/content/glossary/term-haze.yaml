id: term-haze
type: glossaryterm
title: Haze
term: Haze
definition: What compound leaves on the paint. Every compounded square gets a yellow pad and M210 pass to clear it, and a compounded panel never ships without it. The yellow can leave faint haze on soft black paint too. A final gloss pass with M210 on the black pad, with lighter pressure, is a planned future use for that.
