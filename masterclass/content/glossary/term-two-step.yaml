id: term-two-step
type: glossaryterm
title: Two-step correction
term: Two-step
definition: A cutting step, then a finishing step, over the whole car. On a mid-size sedan it takes about 4 h 55 m on paint, against 2 h 30 m for a one-step. No two-step is sold until 25 cars are logged.
