id: term-marring
type: glossaryterm
title: Marring
term: Marring
definition: Marks clay can leave in the paint, most of all on soft or black paint. Clay mitts are riskier than a bar on that paint. Marring from clay gets polished out, so plan a polish after clay.
alsoCalled: [mar, marred paint]
audience: [owner, ops, crew]
visibility: internal
status: sourced
