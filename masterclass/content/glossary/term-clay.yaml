id: term-clay
type: glossaryterm
title: Clay
term: Clay
definition: A clay bar you glide over lubed paint to lift the bonded contamination the wash leaves behind. The bag test decides which panels get it. Paint only, never glass. A dropped bar goes in the trash. Clay can mar soft or black paint, so plan a polish after clay.
