title: Mobile fee
term: Mobile fee
definition: The +$30 when Lando comes to the customer instead of a drop-off. Call it a convenience fee, never a drop-off discount. Outside Tooele, Stansbury, and Grantsville, travel adds $1.50 per mile on mobile jobs.
