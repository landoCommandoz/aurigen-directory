id: term-strip-wash
type: glossaryterm
title: Strip wash
term: Strip wash
definition: A wash strong enough to strip wax, done before polishing. Yours is CG Citrus Wash & Gloss at 1 oz per gal (4 oz in the 4-gal bucket), above Chemical Guys' 3 oz strip figure. A car with a glaze or filler job gets a strip wash first.
alsoCalled: [strip strength wash]
