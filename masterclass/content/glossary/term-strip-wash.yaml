    url: https://www.chemicalguys.com/blogs/exterior-how-tos/how-to-choose-the-right-car-wash-soap
    date: 2026-10-10
    note: Up to 3 oz to strip old coatings. It does not say per how much water, so the comparison stays unverified until Lando reads his bottle. Fact-checker FC-02.
