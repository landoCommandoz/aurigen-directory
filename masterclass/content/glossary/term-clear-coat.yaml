id: term-clear-coat
type: glossaryterm
title: Clear coat
term: Clear coat
definition: The clear top layer of the paint. It is usually about 35 to 50 µm (1.5 to 2 mils) thick. Polishing removes a thin layer of it to level out swirls. Paint color on the pad means you are through the clear, so stop.
alsoCalled: [clear, clearcoat]
audience: [owner, ops, crew]
visibility: internal
status: sourced
version: 2
kbRef: "16"
tags: [paint, layers]
synonyms:
  - clear coat
  - clearcoat
  - the clear
  - top layer
  - through the clear
  - clear layer
sources:
