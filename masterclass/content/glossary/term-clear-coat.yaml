id: term-clear-coat
type: glossaryterm
title: Clear coat
term: Clear coat
definition: The clear top layer of the paint. Polishing removes a thin layer of it to level out swirls. Paint color on the pad means you are through the clear, so stop.
alsoCalled: [clear, clearcoat]
audience: [owner, ops, crew]
visibility: internal
