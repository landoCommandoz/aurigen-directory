# Search cases. Owner: troubleshooter. The content build (npm run content) runs every case
# against the same index the app ships and fails when the top result is not one of `expect`.
#
# Part 1 is knowledge base 24, in its order. `kb` keeps the knowledge base wording of the answer.
# A section number maps to the items that hold that section today:
#   FIX-NN is fix-NN. 4 is the mix cards. 7.2 is the gauge lesson, the TC100 item, and the
#   zero fix. 7.3 is the thickness bands card and lesson. 7.4 is the kills-the-buff card and
#   lesson. 8.2 is the pad priming card and lesson. 11 is the Tesla card and the Tesla roof fix.
#   12.1 is the bike rules card and the bike fixes. 13 and 13.1 are the cleanup SOP, the towel
#   laundry fix, the pad care lesson, and the crusty pad fix. 14 is the backing plate item.
#   15.1 mobile and travel is the mobile fee term and the mobile polishing fix. 15.2 is the
#   cancel and deposit fix (fix-89). 9.4 is the headlight fix and the headlight restorer.
#
# Two knowledge base 24 cases are parked below Part 2, commented out (QA DEF-22, later):
# "price suv full detail" (15.1) and "store it clean" (12.2). Their answers are price items,
# which are Phase 4 (business-customer), and search leaves price items out until they have a
# page (src/core/searchEngine.ts SEARCH_TYPES). QA pins exactly this pair as parked in
# tests/unit/search-cases.test.ts (PARKED). Until then the Level 7 outline lessons hold the
# same prices, and search lands there (two interim guards and the parked block, at the end of
# Part 2). Turn both back on when price items have pages, and QA empties PARKED in the
# same change.
#
# Part 2 is the way a frustrated person types or dictates with gloves on: no apostrophes,
# filler words, slang, and the words a dictation app gets wrong ("hoping" for "hopping").
