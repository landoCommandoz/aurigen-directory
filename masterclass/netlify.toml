# Masterclass 101 on Netlify (DECISIONS D5).
# Deploys are manual: the masterclass-netlify workflow builds on GitHub's
# runner and uploads dist/ with --no-build, so there is no build command, no
# Git link, and no functions. Run the Netlify CLI from masterclass/ so this is
# the file it reads, not the Aurigen netlify.toml at the repo root.

[build]
  publish = "dist"

# Single-page app: a path that is not a real file serves the app shell.
# Real files (assets, sw.js, the manifest, icons) are always served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    # Keep this on one line: vite.config.ts reads it, copies it into a <meta>
    # tag for hosts that send no headers (GitHub Pages, vite preview), and
    # fails the build if an inline script's sha256 is missing here.
    # The sha256 below is the boot guard script in index.html.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-WsYg/ub0V5lY+NJbce7vQuPilXN9T5aFcOO9mDz/ofo='; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Hashed build files never change once published, so phones can keep them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
