# Makes one single-use, 100% off, 48-hour discount code for the Aurigen Rules Sheet (test purchase) and prints it in the
# run log and the run summary. The log of a public repo is public, so the code is only worth anything once, for 48
# hours, for that one product. Reuses an unexpired unused code instead of making another.
# Runs when polar/test-discount.json changes on main, or by hand. No Claude, no API cost.
name: Polar discount

on:
  push:
    branches: [main]
    paths:
      - polar/test-discount.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polar-discount
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Create or find the test code
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
        run: node polar/create-test-discount.mjs
