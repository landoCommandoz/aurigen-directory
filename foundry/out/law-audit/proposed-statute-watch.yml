# Proposed workflow: copy to .github/workflows/statute-watch.yml (this run's token cannot add workflows).
# Monthly re-download of every statute page the law ledgers cite. Opens one issue if a cited quote is gone,
# a page's text changed, or a page could not be fetched. Never edits or deploys anything.
name: Statute watch

on:
  schedule:
    - cron: '17 9 3 * *'   # 09:17 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Re-check cited statutes
        id: watch
        working-directory: cloudflare
        run: |
          set +e
          node scripts/watch-statutes.mjs --out "$RUNNER_TEMP/statute-watch.md"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "10" ]; then
            printf 'Statute watch script failed with exit code %s. See the workflow run log.\n' "$code" > "$RUNNER_TEMP/statute-watch.md"
          fi
      - name: Open issue if anything changed or failed
        if: steps.watch.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(grep -c '^- ' "$RUNNER_TEMP/statute-watch.md" || true)
          [ "$n" = "0" ] && n=1
          {
            cat "$RUNNER_TEMP/statute-watch.md"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Statute watch: $n cited sources changed" --body-file "$RUNNER_TEMP/body.md"
